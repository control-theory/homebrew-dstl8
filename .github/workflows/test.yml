name: test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: Monday 9am UTC
    - cron: "0 9 * * 1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Tap
        run: brew tap control-theory/dstl8 .

      - name: Install
        run: brew install dstl8

      - name: Test
        run: brew test dstl8

      - name: Audit
        run: brew audit --strict dstl8
